server:
  port: 8084

spring:
  application:
    name: CART-SERVICE

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/cart_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
       defaultZone: http://discovery-server:8761/eureka/