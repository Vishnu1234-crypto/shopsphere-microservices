server:
  port: 8083

spring:
  application:
    name: INVENTORY-SERVICE

  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/inventory_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://host.docker.internal:8761/eureka/