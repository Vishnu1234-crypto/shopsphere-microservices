server:
  port: 8083

spring:
  application:
    name: INVENTORY-SERVICE

  datasource:
    url: jdbc:postgresql://postgres:5432/inventory_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true