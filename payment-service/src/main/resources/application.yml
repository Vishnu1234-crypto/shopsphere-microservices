server:
  port: 8086

spring:
  application:
    name: PAYMENT-SERVICE

  datasource:
    url: jdbc:postgresql://postgres:5432/payment_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true